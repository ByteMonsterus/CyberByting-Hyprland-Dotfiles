# https://wiki.hypr.land/Configuring/Variables/#decoration

decoration {
    rounding = 14

    active_opacity = 0.97
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 10
        passes = 4

        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(00000099)
    }
}
